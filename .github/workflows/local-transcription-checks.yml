name: Local transcription checks

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:browser-asr
      - run: npm test
      - run: python -m unittest discover -s local-asr -p 'test_*.py' -v
      - run: npm run smoke:browser

  maximum-candidate:
    if: github.ref == 'refs/heads/feature/local-transcription-planning'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:browser-asr
      - run: df -h /
      - run: npm run smoke:maximum

  browser-tier-candidates:
    if: github.ref == 'refs/heads/feature/local-transcription-planning'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        tier: [rapido, bilanciato]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:browser-asr
      - run: node scripts/run-browser-smokes.mjs --browser-model ${{ matrix.tier == 'bilanciato' && '--balanced' || '' }}
